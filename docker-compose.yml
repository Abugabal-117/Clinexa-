version: '3.8'

services:
  web:
    build: .
    container_name: clinexa-app
    ports:
      - "5000:5000"
    volumes:
      - ./src/data:/app/src/data
      - ./src:/app/src
    environment:
      - FLASK_APP=src/app.py
      - FLASK_ENV=development
      - PYTHONUNBUFFERED=1
    command: python -m flask run --host=0.0.0.0
    stdin_open: true
    tty: true
