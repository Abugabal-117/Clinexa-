<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Report Management</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    
    <script>
        function updatePatientName() {
            var select = document.getElementById('patientSelect');
            var text = select.options[select.selectedIndex].text;
            document.getElementById('patientNameHidden').value = text;
        }
    </script>
</head>
<body class="doctor-dashboard-body"> <div class="nav-container">
        <a href="{{ url_for('dashboard') }}" class="back-link" style="color:
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            Back to Dashboard
        </a>
    </div>

    <div class="center-content flex-direction-column align-items-center">

        <div class="page-header-text">
            <h1 style="color:
            <p style="color:
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div style="width: 100%; max-width: 1000px; margin-bottom: 20px;">
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}" style="padding: 15px; border-radius: 8px; background:
                        {{ message }}
                    </div>
                {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <div class="report-grid">

            <div class="content-card left-panel" style="border-top: 4px solid
                <div class="report-section-header">
                    <div class="icon-box-blue" style="background:
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                            <polyline points="14 2 14 8 20 8"></polyline>
                            <line x1="16" y1="13" x2="8" y2="13"></line>
                            <line x1="16" y1="17" x2="8" y2="17"></line>
                            <polyline points="10 9 9 9 8 9"></polyline>
                        </svg>
                    </div>
                    <h3 class="report-section-title">Generate Report</h3>
                </div>

                <form action="{{ url_for('patient_report') }}" method="POST">
                    
                    <div class="form-group">
                        <label>Select Patient</label>
                        <div class="input-wrapper">
                            <svg class="input-icon" viewBox="0 0 24 24" style="color:
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                            
                            <select name="patient_id" id="patientSelect" class="form-control" onchange="updatePatientName()" required 
                                style="width: 100%; padding: 12px 12px 12px 40px; border: 1px solid
                                <option value="" disabled selected>-- Choose a patient --</option>
                                {% if patients %}
                                    {% for patient in patients %}
                                        <option value="{{ patient.user_id }}">{{ patient.first_name }} {{ patient.last_name }}</option>
                                    {% endfor %}
                                {% else %}
                                    <option value="" disabled>No patients found</option>
                                {% endif %}
                            </select>
                            
                            <input type="hidden" name="patient_name_hidden" id="patientNameHidden">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Diagnosis & Details</label>
                        <textarea name="report_details" class="form-control report-textarea" rows="8"
                            placeholder="Enter symptoms, diagnosis, and treatment details..."
                            required style="border-color:
                    </div>

                    <div class="report-button-group">
                        <button type="submit" class="btn btn-blue" style="background-color:
                    </div>
                </form>
            </div>

            <div class="content-card" style="border-top: 4px solid
                <div class="report-section-header">
                    <div class="icon-box-blue" style="background:
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        </svg>
                    </div>
                    <h3 class="report-section-title">Recent Reports</h3>
                </div>

                {% if reports and reports|length > 0 %}
                <div class="reports-list" style="max-height: 500px; overflow-y: auto;">
                    {% for report in reports %}
                    <div class="report-card" style="border-left: 4px solid
                        <div class="report-card-header" style="display: flex; justify-content: space-between; margin-bottom: 8px; border-bottom: 1px solid
                            <div class="report-patient-name" style="font-weight: bold; color:
                                {{ report.patient_name }}
                            </div>
                            <div class="report-date" style="font-size: 0.8rem; color:
                                {{ report.created_at }}
                            </div>
                        </div>
                        <div class="report-content" style="color:
                    </div>
                    {% endfor %}
                </div>
                {% else %}
                <div class="empty-state" style="text-align: center; padding: 40px 0;">
                    <p class="empty-state-message" style="color:
                </div>
                {% endif %}

            </div>

        </div>
    </div>

</body>
</html>
