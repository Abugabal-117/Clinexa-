<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="doctor-login-body">

    <div class="back-link-wrapper">
        <a href="{{ url_for('home') }}" class="back-link" style="color: var(--doctor-primary);">← Back to Home</a>
    </div>

    <div class="center-content">
        <div class="auth-card doctor-card">

            <div class="doctor-badge">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4.8 2.3A.3.3 0 1 0 5 2H4a2 2 0 0 0-2 2v5a6 6 0 0 0 6 6v0a6 6 0 0 0 6-6V4a2 2 0 0 0-2-2h-1a.2.2 0 1 0 .3.3"></path>
                    <path d="M8 15v1a6 6 0 0 0 6 6v0a6 6 0 0 0 6-6v-4"></path>
                    <circle cx="20" cy="10" r="2"></circle>
                </svg>
                Doctor Portal
            </div>

            <h1 style="color:
            <p class="text-secondary">Please enter your credentials to access the dashboard.</p>

            <form action="{{ url_for('login') }}" method="POST">
                
                <div class="form-group">
                    <label>Email Address</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" style="color: var(--doctor-primary);" viewBox="0 0 24 24">
                            <path d="M20 4H4c-1.103 0-2 .897-2 2v12c0 1.103.897 2 2 2h16c1.103 0 2-.897 2-2V6c0-1.103-.897-2-2-2zm0 2v.511l-8 6.223-8-6.222V6h16zM4 18V9.044l7.386 5.745a.994.994 0 0 0 1.228 0L20 9.044 20.002 18H4z"></path>
                        </svg>
                        <input type="email" name="email" class="doctor-input" placeholder="doctor@clinic.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" style="color: var(--doctor-primary);" viewBox="0 0 24 24">
                            <path d="M12 2C9.243 2 7 4.243 7 7v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7c0-2.757-2.243-5-5-5zM9 7c0-1.654 1.346-3 3-3s3 1.346 3 3v3H9V7zm9 13H6v-8h12v8z"></path>
                        </svg>
                        <input type="password" name="password" class="doctor-input" placeholder="Enter your password" required>
                    </div>
                </div>

                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <a href="{{ url_for('forgot_password') }}" class="doctor-link" style="font-size: 0.9rem;">Forgot Password?</a>
                </div>

                <button type="submit" class="btn-doctor">Access Dashboard</button>
            </form>
        </div>
    </div>
</body>
</html>
